# Perfil LOCAL - Lee dispositivos Tasmota y envía al cloud
spring.application.name=ms-concentrador-energia-local
server.port=8080

# Base de datos DESHABILITADA en local (no necesaria, solo lee y envía)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

spring.jackson.time-zone=America/Santiago

# Logging para debug de inversor Solis
logging.level.com.pablofierro.energia.services.TasmotaReaderService=DEBUG

# Dispositivos Tasmota a leer (ACTIVO EN LOCAL)
modbus.devices=192.168.2.221,192.168.2.77,192.168.2.26,192.168.2.163
tasmota.timeout=5000

# IP del inversor Solis Datalogger (scraping web)
solis.inverter.ip=192.168.2.72

# Intervalo de lectura: cada 30 segundos (ACTIVO EN LOCAL)
modbus.polling.interval=30000

# Endpoint cloud donde enviar las mediciones
# Se sobrescribe con variable de entorno CLOUD_ENDPOINT_URL en docker-compose
cloud.endpoint.url=${CLOUD_ENDPOINT_URL:http://35.209.63.29:8002/api/energia/recibir-mediciones}

# Configuracion del nodo de temperatura T110
temperature.node.t110.enabled=true
temperature.node.t110.ip=192.168.2.110
